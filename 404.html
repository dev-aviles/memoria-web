<title>Memoria</title>

<link rel="stylesheet" href="style.css">
<script>
  // The exact path someone shared (e.g. /collection/abc123) maps
  // directly onto the app's own memoria:// scheme — same shape,
  // just a different prefix. The app itself doesn't route these yet
  // (that's the separate Universal Links piece), but a person who
  // already has Memoria installed and taps this link will still
  // launch straight into the app via this scheme.
  window.addEventListener("DOMContentLoaded", function () {
    var path = window.location.pathname;
    var appURL = "memoria:/" + path;
    window.location.href = appURL;
  });
</script>
</head>
